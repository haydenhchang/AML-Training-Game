<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Know Your Customer — An AML Compliance Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11140f;
    --booth:#3c4a44;        /* desaturated teal booth wall */
    --booth-dark:#2b3530;
    --desk:#5a4f38;         /* grimy wooden/metal desk */
    --desk-dark:#473e2b;
    --panel:#39443d;
    --panel2:#4a564d;
    --ink:#d7ddd0;
    --ink-dim:#93a094;
    --line:#1c211c;         /* hard black-green outlines */
    --green:#7d9b4e;
    --amber:#cBa24a;
    --red:#b14a32;
    --blue:#5a8199;
    --stamp-red:#a82a1c;
    --stamp-green:#3f6d39;
    --paper:#d8cdab;        /* aged document paper */
    --paper2:#cabf99;
    --paper-ink:#2a2417;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:#0a0c08;
    color:var(--ink);
    font-family:"VT323","Courier New",monospace;
    font-size:20px;
    line-height:1.15;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    overflow:hidden;
    image-rendering:pixelated;
  }
  canvas.pxface{image-rendering:pixelated;image-rendering:crisp-edges;}
  #game{
    width:100%;
    max-width:1000px;
    height:100%;
    max-height:720px;
    background:var(--panel);
    border:2px solid var(--line);
    box-shadow:0 0 0 4px #000, 0 18px 40px rgba(0,0,0,.6);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  header{
    background:linear-gradient(#34382f,#262a22);
    border-bottom:2px solid var(--line);
    padding:8px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    letter-spacing:1px;
  }
  header .title{font-weight:bold;color:var(--amber);text-transform:uppercase;font-size:22px;}
  header .stats{display:flex;gap:18px;font-size:18px;color:var(--ink-dim);}
  header .stats b{color:var(--ink);}
  #muteBtn,#pauseBtn{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:3px;cursor:pointer;font-size:15px;padding:1px 6px;}
  #muteBtn:hover,#pauseBtn:hover{color:var(--ink);}
  .pause-screen{position:absolute;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:rgba(8,10,7,.92);}
  .pause-screen.show{display:flex;}
  .pause-screen h1{color:var(--amber);letter-spacing:4px;margin:0 0 6px;}
  .pause-screen p{color:var(--ink-dim);}
  .pause-screen .big{font-size:60px;margin-bottom:10px;}
  .strike{color:var(--red);}
  /* CRT scanlines + vignette over everything (non-interactive) */
  .crt{position:absolute;inset:0;z-index:50;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(130% 120% at 50% 50%, transparent 58%, rgba(0,0,0,.45) 100%);
    mix-blend-mode:multiply;opacity:.5;}
  .crt.off{display:none;}
  main{flex:1;display:flex;min-height:0;}
  .booth{
    flex:1;
    padding:14px;
    overflow-y:auto;
    border-right:3px solid var(--line);
    /* grimy desk surface: wood-grain streaks + grime vignette */
    background-color:var(--desk);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 7px),
      radial-gradient(120% 80% at 50% -10%, rgba(0,0,0,.45), transparent 60%);
  }
  .sidebar{
    width:262px;
    background:var(--booth-dark);
    display:flex;
    flex-direction:column;
    border-left:1px solid #000;
  }
  .sidebar .tabs{display:flex;border-bottom:3px solid var(--line);}
  .sidebar .tabs button{
    flex:1;background:var(--booth);color:var(--ink-dim);border:none;
    border-right:1px solid #000;padding:8px 4px;cursor:pointer;
    font-family:inherit;font-size:18px;text-transform:uppercase;letter-spacing:1px;
  }
  .sidebar .tabs button.active{background:var(--panel2);color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber);}
  .sidebar .tabcontent{flex:1;overflow-y:auto;padding:12px;font-size:18px;display:none;}
  .sidebar .tabcontent.active{display:block;}
  h3{margin:0 0 8px;color:var(--amber);font-size:18px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px;}
  .rule{margin:0 0 10px;padding-left:8px;border-left:4px solid var(--green);}
  .rule.new{border-left-color:var(--amber);animation:flash 1s ease 3;}
  .rule b{color:#fff;}
  @keyframes flash{50%{background:rgba(199,155,59,.18);}}
  .watch-item{padding:4px 6px;border-bottom:1px dashed var(--line);color:#e3b0a3;}
  .watch-item small{color:var(--ink-dim);}
  .glossary-item{margin:0 0 10px;padding:0 0 8px 8px;border-left:3px solid var(--blue);border-bottom:1px dashed var(--line);}
  .glossary-item b{color:var(--amber);}
  .glossary-item div{color:var(--ink);margin:2px 0;}
  .glossary-item a{color:#7fc0db;font-size:13px;text-decoration:none;word-break:break-all;}
  .glossary-item a:hover{text-decoration:underline;}

  /* bank teller station: marble wall, brass sign, vaulted lobby beyond the glass */
  .scene{
    position:relative;height:198px;margin:-14px -14px 14px;overflow:hidden;
    background:
      repeating-linear-gradient(95deg, rgba(255,255,255,.04) 0 1px, transparent 1px 60px),
      linear-gradient(#5d6b62,#48564f 58%,#3a4842);   /* marble wall */
    border-bottom:4px solid var(--line);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.35);
  }
  .banksign{ /* brass nameplate over the window */
    position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:7;
    background:linear-gradient(#d8b358,#a9842f);color:#241c08;
    font-family:"VT323",monospace;font-size:16px;letter-spacing:2px;text-transform:uppercase;
    padding:2px 16px;border:2px solid #6e5320;border-radius:3px;white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .scene .counter{ /* polished marble teller counter */
    position:absolute;left:0;right:0;bottom:0;height:38px;z-index:6;
    background:linear-gradient(#c2bca8,#938b78 50%,#6d6757);
    border-top:4px solid #2e2820;
    box-shadow:0 -3px 0 rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .scene .counter:after{ /* transaction tray slot in the counter */
    content:"";position:absolute;left:50%;top:9px;transform:translateX(-50%);
    width:150px;height:8px;background:#1e1b15;border-radius:4px;box-shadow:inset 0 2px 3px rgba(0,0,0,.7);
  }
  .window{ /* teller glass looking into the bank lobby */
    position:absolute;left:50%;bottom:38px;transform:translateX(-50%);
    width:236px;height:130px;z-index:2;overflow:hidden;
    border:5px solid #2c2a22;border-bottom:none;border-radius:3px;
    background:linear-gradient(#d7b58e,#c0996f 65%,#a87d54); /* warm lobby light */
  }
  .lobby{ position:absolute;inset:0;z-index:1;
    background:linear-gradient(#cdb088,#b08a62 58%,#8e6c47);
  }
  .lobby .floor{ position:absolute;left:0;right:0;bottom:0;height:26px;
    background:repeating-linear-gradient(90deg,#7c5c3c 0 14px,#8b6a48 14px 28px);
    border-top:2px solid #5a4128; }
  .lobby .vault{ /* round bank vault door in the back wall */
    position:absolute;left:50%;top:24px;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #9aa0a4,#62686d 62%,#41464a);
    border:5px solid #2c3033;box-shadow:0 0 0 3px #6a7074, inset 0 0 9px rgba(0,0,0,.6);
  }
  .lobby .vault:after{ content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;
    background:#262a2d;border:3px solid #80878c; } /* vault wheel */
  .lobby .col{ position:absolute;top:0;bottom:24px;width:20px;
    background:linear-gradient(90deg,#efe7d4,#ccbf9f 55%,#a89875);
    border-left:2px solid rgba(255,255,255,.45);border-right:2px solid rgba(0,0,0,.25);
    box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .lobby .col.left{ left:16px; } .lobby .col.right{ right:16px; }
  .window .glare{ /* glass reflection streak */
    position:absolute;inset:0;z-index:5;pointer-events:none;
    background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.16) 40%, transparent 43%, transparent 70%, rgba(255,255,255,.08) 72%, transparent 75%);
  }
  .customer{
    position:absolute;bottom:0;left:-100px;z-index:3;
    display:flex;flex-direction:column;align-items:center;transition:none;
  }
  .customer .sprite{ width:60px;height:auto;display:block; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.4)); }
  .customer .body{
    width:54px;height:46px;margin-top:-2px;border-radius:10px 10px 0 0;
    background:#566154;border:3px solid var(--line);border-bottom:none;
  }
  .customer.walking .sprite{animation:bob .34s steps(2,end) infinite;}
  .customer.walking .body{animation:sway .34s steps(2,end) infinite;}
  @keyframes bob{50%{transform:translateY(-3px);}}
  @keyframes sway{50%{transform:translateX(-2px);}}
  .customer.walkIn{ animation:walkIn 1.15s steps(8,end) forwards; }
  .customer.walkOut{ animation:walkOut 1.0s steps(7,end) forwards; }
  @keyframes walkIn{ from{left:-100px;} to{left:calc(50% - 30px);} }
  @keyframes walkOut{ from{left:calc(50% - 30px);opacity:1;} to{left:130%;opacity:.3;} }
  .dossier{transition:opacity .35s ease, transform .35s ease;}
  .dossier.hidden{opacity:0;pointer-events:none;transform:translateY(40px) scale(.96);} /* papers pulled into the slot */
  /* queue line of waiting customers behind the glass */
  .queue{position:absolute;bottom:2px;left:6px;right:6px;z-index:2;display:flex;gap:6px;justify-content:flex-end;align-items:flex-end;opacity:.8;}
  .qfig{display:flex;flex-direction:column;align-items:center;filter:brightness(.7) saturate(.7);}
  .qfig canvas{width:26px;height:auto;image-rendering:pixelated;}
  .qfig .qbody{width:22px;height:14px;border-radius:6px 6px 0 0;background:#4a5247;border:2px solid var(--line);border-bottom:none;margin-top:-2px;}

  /* documents = aged papers tossed on the desk */
  .doc{
    background:var(--paper);
    background-image:
      radial-gradient(80% 60% at 80% 10%, rgba(120,100,60,.10), transparent 60%),
      radial-gradient(50% 40% at 10% 90%, rgba(90,70,40,.12), transparent 60%);
    color:var(--paper-ink);
    border:1px solid #8d8262;
    padding:10px 14px 14px;
    margin:0 0 14px;
    font-family:"Special Elite","Courier New",monospace;
    font-size:15px;
    box-shadow:3px 4px 0 rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.25);
    position:relative;
  }
  /* slight scatter so it reads like papers on a desk */
  .doc:nth-of-type(odd){ transform:rotate(-1.1deg); }
  .doc:nth-of-type(even){ transform:rotate(0.9deg); }
  .doc.passport{ background:var(--paper2); border:2px solid #7c7150; }
  .doc .doc-title{
    font-family:"VT323",monospace;
    font-weight:bold;text-transform:uppercase;letter-spacing:1px;
    font-size:18px;border-bottom:2px solid #8d8262;padding-bottom:4px;margin-bottom:8px;
    display:flex;justify-content:space-between;color:#5a4b2e;
  }
  .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:15px;}
  .row .k{color:#6b6450;text-transform:uppercase;}
  .row .v{font-weight:bold;text-align:right;color:#211c10;}
  .idcard{display:flex;gap:12px;}
  .idphoto{
    width:66px;height:80px;flex:0 0 66px;background:#8d978c;
    border:2px solid #4b4632;padding:2px;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .idphoto canvas{ width:60px;height:auto;display:block; }
  .idfields{flex:1;}

  /* ===== Photo ID cards (driver license / passport) ===== */
  .iddoc{
    position:relative;margin:0 0 16px;border-radius:8px;overflow:hidden;
    box-shadow:3px 5px 0 rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.25);
    font-family:"VT323",monospace;
  }
  .iddoc:nth-of-type(odd){ transform:rotate(-1.4deg); }
  .iddoc .idphoto{ background:#8d978c; }

  /* --- Driver License: small credit-card sized (~1.6:1 landscape) --- */
  .iddoc.dl{
    width:308px;                 /* card-sized, NOT full width */
    background:linear-gradient(135deg,#e8eee6,#d2ddd6 60%,#c3d2cb);
    border:2px solid #2f3b34;border-radius:11px;
    transform:rotate(-2deg);
  }
  .iddoc.dl:before{ /* guilloché security pattern */
    content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
    background:
      repeating-radial-gradient(circle at 22% 60%, #2f6d6d 0 1px, transparent 1px 9px),
      repeating-linear-gradient(60deg, #3f6d39 0 1px, transparent 1px 8px);
  }
  .dl-top{
    position:relative;display:flex;align-items:center;gap:6px;
    background:linear-gradient(#2f6d4f,#245a40);color:#eafff0;
    padding:3px 8px;font-size:14px;letter-spacing:1px;text-transform:uppercase;
    border-bottom:2px solid #16331f;
  }
  .dl-top .dl-flag{color:#ffd95a;}
  .dl-top .dl-state{font-weight:bold;}
  .dl-top .dl-kind{margin-left:auto;color:#cdedd7;}
  .dl-body{position:relative;display:flex;gap:9px;padding:7px 9px;}
  .dl-photo{ width:54px;height:66px;flex:0 0 54px;border:2px solid #2f3b34;padding:2px;display:flex;align-items:flex-end;justify-content:center;}
  .dl-photo canvas{ width:48px;height:auto; }
  .dl-fields{flex:1;color:#16241c;font-size:13px;line-height:1.1;}
  .dlf{display:flex;gap:6px;padding:0;border-bottom:1px dotted rgba(0,0,0,.18);}
  .dlf .k{color:#3f6d4f;min-width:30px;text-transform:uppercase;font-size:11px;}
  .dlf .v{font-weight:bold;color:#10211a;}
  .dlf.two{justify-content:space-between;gap:8px;}
  .dlf.two .k{min-width:0;}
  .dl-seal{
    position:absolute;right:8px;bottom:4px;font-size:30px;color:rgba(47,109,79,.30);
    transform:rotate(-10deg);pointer-events:none;
  }
  .dl-sig{
    font-family:"Special Elite",cursive;font-size:16px;color:#1c2a22;
    padding:1px 9px 5px;border-top:1px solid rgba(0,0,0,.2);font-style:italic;
  }

  /* --- Passport: realistic data page (booklet) --- */
  .iddoc.pp{ width:432px; background:#c9ba98; border:2px solid #4a3a22; border-radius:7px; padding:5px; transform:rotate(1.1deg); }
  .pp-page{
    position:relative;overflow:hidden;border:1px solid #9a8a64;border-radius:3px;
    background:
      repeating-radial-gradient(circle at 26% 34%, rgba(46,78,134,.07) 0 2px, transparent 2px 8px),
      repeating-linear-gradient(58deg, rgba(46,78,134,.05) 0 1px, transparent 1px 7px),
      linear-gradient(#efe7d1,#ddd0b1);                                  /* guilloché security tint */
  }
  .pp-head{ display:flex;align-items:center;gap:8px;padding:6px 11px;border-bottom:2px solid #8a7748; }
  .pp-seal{
    width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid #b08a2e;
    background:radial-gradient(circle,#f6e9bb,#d8c382);color:#8a6a1e;font-size:16px;
    display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 4px rgba(0,0,0,.2);
  }
  .pp-titles{flex:1;}
  .pp-country{font-family:"VT323",monospace;font-size:19px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#1d2a4a;}
  .pp-kind{font-family:"Special Elite",monospace;font-size:12px;color:#5a4b2e;font-style:italic;}
  .pp-type{font-family:"VT323",monospace;font-size:11px;color:#5a4b2e;text-align:center;line-height:1;}
  .pp-type b{font-size:18px;color:#1d2a4a;}
  .pp-body{position:relative;display:flex;gap:11px;padding:9px 11px;}
  .pp-photo{ width:78px;height:96px;flex:0 0 78px;border:2px solid #3a2e1a;padding:2px;background:#8d978c;
    display:flex;align-items:flex-end;justify-content:center;filter:sepia(.3) contrast(1.05);box-shadow:1px 1px 0 rgba(0,0,0,.35);}
  .pp-photo canvas{ width:72px;height:auto; }
  .pp-fields{flex:1;display:flex;flex-direction:column;gap:1px;padding-right:30px;}
  .ppf{display:flex;flex-direction:column;border-bottom:1px dotted rgba(90,61,34,.3);padding:0;}
  .ppf.two{flex-direction:row;gap:14px;}
  .ppf.two>span{display:flex;flex-direction:column;}
  .ppf .k{color:#7a5a32;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
  .ppf .v{color:#16213a;font-weight:bold;font-size:15px;line-height:1.12;font-family:"Special Elite",monospace;}
  .pp-ghost{ position:absolute;right:9px;bottom:6px;width:40px;height:50px;opacity:.2;filter:grayscale(1);pointer-events:none; }
  .pp-ghost canvas{ width:40px;height:auto; }
  .mrz{
    background:#f4eeda;color:#15130e;font-family:"VT323",monospace;font-size:14px;
    letter-spacing:1px;padding:5px 10px;border-top:2px solid #8a7748;white-space:nowrap;overflow:hidden;line-height:1.4;
  }
  .log{font-size:15px;}
  .log div{padding:1px 0;border-bottom:1px dotted #b3ab92;}
  .muted{color:#6b6450;font-style:italic;}

  /* ===== Account ledger — green-bar statement paper ===== */
  .ledger{
    position:relative;width:452px;max-width:100%;margin:0 0 16px;
    border:1px solid #8a9a7e;border-radius:2px;overflow:hidden;
    background:#eaf1e0;
    background-image:repeating-linear-gradient(#e7efdd 0 21px, #d6e4c8 21px 42px); /* green bars */
    font-family:"Special Elite","Courier New",monospace;color:#26301f;
    box-shadow:3px 4px 0 rgba(0,0,0,.45);transform:rotate(-0.7deg);
  }
  .ledger:before{ content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:#c0564a;opacity:.45; } /* red margin rule */
  .ledger:after{ content:"";position:absolute;left:8px;top:0;bottom:0;width:6px;
    background:repeating-linear-gradient(#fff 0 5px,#cfd9c4 5px 10px); } /* perforated edge */
  .ledger-top{
    position:relative;background:linear-gradient(#33402a,#26301f);color:#dfe8cf;
    font-family:"VT323",monospace;font-size:17px;letter-spacing:1px;text-transform:uppercase;
    padding:5px 12px;display:flex;justify-content:space-between;border-bottom:2px solid #16210e;
  }
  .ledger-body{padding:7px 14px 10px 38px;}
  .lrow{display:flex;justify-content:space-between;gap:10px;padding:1px 0;font-size:15px;}
  .lrow .k{color:#5a6b4a;text-transform:uppercase;font-size:13px;}
  .lrow .v{font-weight:bold;color:#1a2414;}
  .ledger-sub{font-family:"VT323",monospace;text-transform:uppercase;font-size:15px;color:#3f6d39;
    border-bottom:1px solid #9aaa86;margin:7px 0 2px;letter-spacing:1px;}
  .ledger-log{font-size:14px;}
  .ledger-log div{display:flex;justify-content:space-between;padding:1px 0;border-bottom:1px dotted #aebb9c;}

  /* ===== Transaction slip — torn teller receipt ===== */
  .slip{
    position:relative;width:282px;margin:0 0 18px;padding:12px 16px 18px;
    background:#fbf7ec;color:#2a2417;font-family:"VT323",monospace;font-size:17px;line-height:1.25;
    box-shadow:3px 4px 0 rgba(0,0,0,.4);transform:rotate(1.6deg);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 3px);
    clip-path:polygon(0 5px,4% 0,8% 5px,12% 0,16% 5px,20% 0,24% 5px,28% 0,32% 5px,36% 0,40% 5px,44% 0,48% 5px,52% 0,56% 5px,60% 0,64% 5px,68% 0,72% 5px,76% 0,80% 5px,84% 0,88% 5px,92% 0,96% 5px,100% 0,
      100% calc(100% - 5px),96% 100%,92% calc(100% - 5px),88% 100%,84% calc(100% - 5px),80% 100%,76% calc(100% - 5px),72% 100%,68% calc(100% - 5px),64% 100%,60% calc(100% - 5px),56% 100%,52% calc(100% - 5px),48% 100%,44% calc(100% - 5px),40% 100%,36% calc(100% - 5px),32% 100%,28% calc(100% - 5px),24% 100%,20% calc(100% - 5px),16% 100%,12% calc(100% - 5px),8% 100%,4% calc(100% - 5px),0 100%);
  }
  .slip-head{text-align:center;font-size:21px;letter-spacing:1px;text-transform:uppercase;}
  .slip-line{text-align:center;font-size:14px;color:#6b6450;}
  .slip-sep{border-top:2px dashed #b3a884;margin:7px 0;}
  .srow{display:flex;justify-content:space-between;gap:10px;padding:1px 0;}
  .srow span:first-child{color:#6b6450;text-transform:uppercase;font-size:13px;}
  .srow span:last-child{font-weight:bold;text-align:right;}
  .srow.big span:last-child{font-size:24px;color:#1c1810;}
  .slip-barcode{height:28px;margin:8px 0 4px;

<body>
<div id="game">
  <header>
    <div class="title">Know Your Customer&nbsp;·&nbsp;BSA/AML Unit</div>
    <div class="stats">
      <span>DAY <b id="stat-day">1</b></span>
      <span>CASE <b id="stat-case">1/1</b></span>
      <span>TIME <b id="stat-time">0:00</b></span>
      <span>BALANCE <b id="stat-pay">$0</b></span>
      <span>STRIKES <b class="strike" id="stat-strikes">0/4</b></span>
      <button id="pauseBtn" title="Pause (P)">⏸</button>
      <button id="muteBtn" title="Mute (M)">🔊</button>
    </div>
  </header>

  <main>
    <div class="booth" id="booth"></div>
    <div class="sidebar">
      <div class="tabs">
        <button data-tab="rules" class="active">Manual</button>
        <button data-tab="watch">Watchlist</button>
        <button data-tab="learn">Learn</button>
      </div>
      <div class="tabcontent active" id="tab-rules"></div>
      <div class="tabcontent" id="tab-watch"></div>
      <div class="tabcontent" id="tab-learn"></div>
    </div>
  </main>

  <div class="actions" id="actions"></div>

  <div class="verdict" id="verdict"></div>
  <div class="overlay" id="overlay"></div>
  <div class="modal" id="sarModal"></div>
  <div class="pause-screen" id="pause">
    <div class="big">⏸</div>
    <h1>PAUSED</h1>
    <p>The shift clock is stopped.</p>
    <button class="cta" id="resumeBtn">Resume</button>
  </div>
  <div class="crt" id="crt"></div>
</div>

<script>
/* =========================================================================
   Know Your Customer — a Papers, Please-style Anti-Money Laundering (AML) game.
   You are a BSA/AML Compliance Officer. Review each customer & transaction,
   then choose the correct disposition. Rules unlock day by day.

   AML facts used (sourced from FinCEN / FFIEC / FDIC / BSA):
   - Cash transactions OVER $10,000 require a Currency Transaction Report (CTR).
   - Suspicious activity requires a Suspicious Activity Report (SAR),
     e-filed within 30 days of detection.
   - Structuring / "smurfing": breaking cash into deposits just under $10k
     to dodge the CTR threshold — itself a federal crime; file a SAR.
   - OFAC sanctions: block transactions for sanctioned persons/entities.
   - KYC: verify identity; ID must match the account and be unexpired.
   - 3 stages of laundering: placement -> layering -> integration.
   ========================================================================= */

const GAME_DATE = new Date(2026, 5, 5); // Jun 5, 2026 — for ID-expiry checks
const CTR_THRESHOLD = 10000;
const MAX_STRIKES = 4;
// economy + clock
const EARN = 300;          // commission per correct disposition
const FINE = 150;          // penalty per wrong disposition (on top of a strike)
const SEC_PER_CASE = 16;   // shift seconds budgeted per customer (the clock only runs while you deliberate)
const RENT = 2100;         // charged once every 3 days (days 3 and 6)
const BILLS = { 1:["Utilities",180,"Groceries",170],
                2:["Utilities",190,"Groceries",180,"Medicine",120],
                3:["Utilities",200,"Groceries",190,"Medicine",140],
                4:["Utilities",210,"Groceries",200,"Daughter's tuition",260],
                5:["Utilities",220,"Groceries",210,"Medicine",160,"Heat",120],
                6:["Utilities",240,"Groceries",220,"Medicine",180,"Heat",140] };
function billsFor(day){
  const a=BILLS[day]||BILLS[6]; let t=0; const items=[];
  if(day%3===0){ items.push(["Rent (3-day)",RENT]); t+=RENT; }  // rent every third day
  for(let i=0;i<a.length;i+=2){ items.push([a[i],a[i+1]]); t+=a[i+1]; }
  // beyond the scripted week, expenses keep climbing so each day demands a cleaner sheet
  if(day>6){ const surge = 60*(day-6); items.push(["Cost-of-living surge",surge]); t+=surge; }
  return {items,total:t};
}
// ---- Difficulty curve: the job gets harder every single day ----
// Endless mode (day >= 7): queues grow longer and the shift clock tightens.
function casesForDay(day){ return day<6 ? 6 : Math.min(16, 8 + (day-6)); }
function secPerCase(day){ return day<=6 ? SEC_PER_CASE : Math.max(7, SEC_PER_CASE-(day-6)); }

/* ---- The compliance manual: rules unlock cumulatively ------------------ */
const RULES = [
  { day:1, html:`<b>APPROVE</b> routine, consistent transactions. This is the
    bank's business — don't flag everything. Over-reporting ("defensive SARs")
    buries real threats and is itself a citation.` },
  { day:1, html:`<b>FILE CTR</b> for any <b>cash</b> transaction <b>over $10,000</b>.
    A Currency Transaction Report is mandatory and routine — the customer is
    still served. (Cash of exactly $10,000 or less does NOT require a CTR.)
    <i>Aggregation: multiple same-day cash transactions by the same person are
    added together toward the $10,000 threshold.</i>` },
  { day:2, html:`<b>BLOCK</b> any customer or counterparty whose name appears on
    the <b>OFAC Watchlist</b>. Sanctioned parties may not be transacted with —
    no exceptions, no tipping them off.` },
  { day:3, html:`<b>KYC</b> — the photo ID must <b>match the account</b> (name AND
    date of birth), the <b>photo must match the person</b> at the window, and it must
    <b>not be expired</b>. Any mismatch, wrong photo, or expired ID: <b>BLOCK</b>.
    <i>Tip: click a field on the ID and the matching field on the account to compare.</i>` },
  { day:4, html:`<b>Structuring / smurfing</b>: a pattern of <b>multiple cash
    deposits just under $10,000</b> to evade the CTR threshold. This is a crime.
    <b>FILE SAR</b>.` },
  { day:5, html:`<b>Suspicious activity</b>: transactions <b>inconsistent with the
    customer's known profile</b> (income, occupation, history) or funds moving
    to/from <b>high-risk jurisdictions</b> with no business rationale.
    <b>FILE SAR</b>.` },
];

/* ---- OFAC-style watchlist (fictional) ---------------------------------- */
const WATCHLIST = [
  { name:"Viktor Kozlov", note:"SDN — narcotics trafficking" },
  { name:"Amara Diallo", note:"SDN — terrorism financing" },
  { name:"Grigor Petrov", note:"SDN — sanctions evasion" },
  { name:"Helix Trade Ltd", note:"Entity — proliferation finance" },

/* ---- Tiny Web-Audio sound engine (no files; synth blips) --------------- */
let actx=null, muted=false;
function audioInit(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==="suspended"){ actx.resume(); }
}
function tone(freq,dur,type,vol,when){
  if(muted||!actx) return;
  const t=actx.currentTime+(when||0), o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"square"; o.frequency.value=freq;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol||0.18,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function sfx(name){
  switch(name){
    case "stamp":  tone(150,0.11,"square",0.32);  tone(72,0.16,"triangle",0.28,0.02); break;
    case "good":   tone(680,0.09,"square",0.2);    tone(1000,0.12,"square",0.2,0.09);  break;
    case "bad":    tone(210,0.18,"sawtooth",0.26); tone(150,0.24,"sawtooth",0.24,0.07);break;
    case "alarm":  tone(900,0.14,"square",0.22);   tone(660,0.14,"square",0.22,0.16); tone(900,0.14,"square",0.22,0.32); break;
    case "cash":   tone(1250,0.05,"square",0.16);  tone(1650,0.06,"square",0.16,0.05); tone(2050,0.09,"square",0.14,0.1); break;
    case "paper":  tone(320,0.05,"triangle",0.09); tone(250,0.06,"triangle",0.07,0.05);break;
    case "tick":   tone(1050,0.03,"square",0.07);  break;
    case "click":  tone(440,0.04,"square",0.1);    break;
  }
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---- Procedural pixel-art portraits (one deterministic face per name) --- */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rngFrom(seed){ return ()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const SKINS  = ["#f3d2ad","#ecc39a","#e0ad7e","#cf9b6c","#b97e4f","#9c6638","#7a4d2b","#5e3a1f"];
const HAIRS  = ["#1b1916","#2c2218","#4a3119","#5a3a1a","#7a5230","#9c6b2e","#c9a24b","#d8c79a","#9aa0a4","#cfd3d6","#1d2a3a","#6e1f1f","#3a1f4a"];
const SHIRTS = ["#566154","#4d5d6b","#6b5a3e","#7a4a4a","#48604f","#5b5b66","#3f5560","#6d4f6b","#7d6a3c","#8a4030","#3d4d5e","#5a6e4a"];
const HATS   = ["#3a3f44","#5a3a1a","#2a3b2a","#6b1f1f","#1d2630","#4a4a52"];
const BACKS  = ["#8d978c","#9aa3a6","#a39a8a","#8f9aa3","#9c968a"];
const LIPS   = ["#a85a4a","#b5564a","#9c4a3e","#c06a5a"];

const FEMALE_NAMES = new Set(("maria edith priya grace sara amara nina yan rosa mei karen karina lena tina helen nadia dana cindy elena anna lucia fatima mary linda susan emily emma olivia sophia sofia isabella mia ava ella nora ruth eva "+

const MALE_NAMES   = new Set(("daniel tom thomas frank hector viktor victor reza grigor liam yusuf james omar greg gregory john jon paul carl derek sam samuel phil philip bill william marcus david michael robert chief donovan hugh "+

function genderOf(name){
  const f=(name||"").trim().split(/\s+/)[0].toLowerCase();
  if(FEMALE_NAMES.has(f)) return "f";
  if(MALE_NAMES.has(f)) return "m";
  return /(a|e|i|ia|elle|ette)$/.test(f) ? "f" : "m"; // soft heuristic for the rest
}
// returns {palette, gender} so callers (the booth sprite) can match the body color
function drawFace(canvas, name){
  const W=16, H=18; canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext("2d"); ctx.imageSmoothingEnabled=false;
  const r=rngFrom(hashStr(name));
  const pick=a=>a[Math.floor(r()*a.length)];
  const gender=genderOf(name);
  const skin=pick(SKINS), hair=pick(HAIRS), shirt=pick(SHIRTS), back=pick(BACKS);
  const px=(c,x,y,w,h)=>{ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };

  ctx.clearRect(0,0,W,H);
  px(back,0,0,W,H);                                  // photo backdrop (varies)
  px(shirt,2,15,12,3);                               // shoulders / clothing
  if(gender==="m" && r()<0.45){ px("rgba(255,255,255,.5)",7,15,2,3); }// shirt collar / tie
  px(skin,7,13,2,2);                                 // neck
  px(skin,4,4,8,10);                                 // face
  px(skin,5,3,6,1);                                  // forehead

  // ---- hair / headwear: pick from a gender-appropriate set of styles ----
  // styles: 0 bald,1 short,2 fringe,3 quiff,4 spike/bun,5 long sides,6 wide/afro,7 hat,8 scarf
  const style = gender==="f" ? pick([2,3,5,5,6,8,2,5]) : pick([0,1,1,3,4,7,1,3]);
  if(style===7){ // hat / cap
    const hat=pick(HATS); px(hat,3,1,10,3); px(hat,2,3,12,1);
    if(r()<0.5){ px(hat,2,4,3,1); }                  // cap brim
  } else if(style===8){ // hood / headscarf
    const sc=pick(SHIRTS); px(sc,3,1,10,4); px(sc,3,4,1,9); px(sc,12,4,1,9);
  } else if(style!==0){
    px(hair,4,2,8,2);                                // top
    if(style!==1){ px(hair,3,3,1,5); px(hair,12,3,1,5); } // sides
    if(style===2){ px(hair,4,4,8,1); }               // fringe
    if(style===3){ px(hair,3,1,10,2); }              // tall/quiff
    if(style===4){ px(hair,7,0,2,2); }               // spike/bun on top
    if(style===5){ px(hair,3,2,2,10); px(hair,11,2,2,10); } // long flowing sides
    if(style===6){ px(hair,2,2,12,2); px(hair,2,2,2,5); px(hair,12,2,2,5);} // wide/afro
  }
  // feminine faces get hair framing down past the ears for clear silhouette
  if(gender==="f" && style!==7 && style!==8){ px(hair,3,4,1,8); px(hair,12,4,1,8); }

  // ---- eyebrows ----
  if(gender==="m" && r()<0.7){ px("rgba(0,0,0,.4)",5,7,2,1); px("rgba(0,0,0,.4)",9,7,2,1); }
  // ---- eyes (+ lashes for feminine) ----
  px("#241f1a",6,8,1,2); px("#241f1a",9,8,1,2);
  if(gender==="f"){ px("rgba(0,0,0,.4)",5,8,1,1); px("rgba(0,0,0,.4)",10,8,1,1); }
  // ---- glasses / sunglasses ----
  const eyewear=r();
  if(eyewear<0.16){ px("#15171a",5,8,3,1); px("#15171a",8,8,3,1); px("#15171a",8,8,1,1); }      // glasses
  else if(eyewear<0.21){ px("#0c0c0c",5,7,6,2); }                                                // sunglasses
  // ---- nose ----
  px("rgba(0,0,0,.16)",8,10,1,1);
  // ---- mouth (lips for feminine, neutral/expression otherwise) ----
  if(gender==="f"){ px(pick(LIPS),6,12,4,1); }
  else { const m=r(); if(m<0.6) px("#7a3b2e",6,12,4,1); else px("#7a3b2e",7,12,2,1); }
  // ---- facial hair (masculine only) ----
  if(gender==="m"){
    const fh=r();
    if(fh<0.22){ px(hair,5,12,6,2); px("#7a3b2e",6,12,4,1); }      // full beard
    else if(fh<0.36){ px(hair,6,13,4,1); }                        // goatee
    else if(fh<0.5){ px(hair,6,11,4,1); }                         // mustache
  }
  // ---- earring (more common on feminine) ----
  if(r() < (gender==="f"?0.3:0.08)){ px("#d8c24b",4,11,1,1); px("#d8c24b",11,11,1,1); }

  return {skin,hair,shirt,back,gender};
}
function paintFaces(root){
  root.querySelectorAll("canvas.pxface").forEach(cv=>{
    const pal = drawFace(cv, cv.dataset.name||"");
    if(cv.classList.contains("sprite")){      // match the standing body to the shirt color
      const body = cv.parentElement.querySelector(".body");
      if(body){ body.style.background = pal.shirt; body.style.borderColor = "#1c211c"; }
    }
  });
}

function buildQueue(day){
  const unused = c => !state.used.has(c.name);
  const FRESH = 4, REVIEW = 2;
  let q;
  if(day>=6){
    // Audit & endless mode: a growing mix with every rule in play. Once the roster
    // is exhausted we recycle the pool so the shift never runs dry.
    const n = casesForDay(day);
    q = shuffle(CASES.filter(unused)).slice(0, n);
    if(q.length < n){
      const have = new Set(q.map(c=>c.name));
      state.used = new Set(have);                 // start a fresh cycle, keep today's picks
      q = q.concat(shuffle(CASES.filter(c=>!have.has(c.name))).slice(0, n-q.length));
    }
  } else {
    // Days 1–5 are the structured teaching ramp: new rule cases + a little review.
    const fresh  = shuffle(CASES.filter(c=>c.minDay===day && unused(c))).slice(0, FRESH);
    const review = shuffle(CASES.filter(c=>c.minDay<day  && unused(c))).slice(0, REVIEW);
    q = fresh.concat(review);
  }
  q.forEach(c=>state.used.add(c.name)); // mark as seen
  return shuffle(q);
}

  el("stat-day").textContent = state.day;

function renderClock(){
  const t = Math.max(0, state.timeLeft|0);
  const el2 = el("stat-time"); if(!el2) return;
  el2.textContent = Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  el2.style.color = t<=10 ? "#e8604a" : "";
}
/* ---- The shift clock: only counts down while you're deliberating a case --- */
function startShiftClock(){
  state.timeLeft = state.queue.length * secPerCase(state.day) + 8;
  state.clockOn = false;
  clearInterval(clockTimer);
  clockTimer = setInterval(()=>{
    if(state.over){ clearInterval(clockTimer); return; }
    if(!state.clockOn) return;
    state.timeLeft--; renderClock();
    if(state.timeLeft<=10 && state.timeLeft>0){ sfx("tick"); }
    if(state.timeLeft<=0){ state.clockOn=false; clearInterval(clockTimer); timeUp(); }
  }, 1000);
  renderClock();
}
function clockGo(){ if(!state.over && state.timeLeft>0) state.clockOn = true; }
function clockStop(){ state.clockOn = false; }
function togglePause(){ state.paused ? resumeGame() : pauseGame(); }
function pauseGame(){
  if(state.paused) return;
  state.paused = true;
  state._wasClock = state.clockOn;   // remember whether the clock was running
  state.clockOn = false;
  el("pause").classList.add("show");
}
function resumeGame(){
  if(!state.paused) return;
  state.paused = false;
  el("pause").classList.remove("show");
  if(state._wasClock && !state.over) state.clockOn = true;  // restore exactly
}
function timeUp(){
  if(state.over) return;
  closeForm();
  state.awaiting = false;
  state.missed += Math.max(0, state.queue.length - state.caseIdx); // current + remaining unprocessed
  endDay(true);
}

/* ---- Render a realistic photo ID: a driver-license card or a passport --- */
function idDocHtml(c, who, matchFlag, expFlag){
  const id = c.id;
  // derive plausible-looking document fields from the name (deterministic)
  const seed = hashStr(id.name);
  const dln = ("D"+String(seed%1e7).padStart(7,"0"));         // license number
  const ppNo = (String.fromCharCode(65+seed%26)+String(seed%1e8).padStart(8,"0")); // passport no
  const parts = id.name.trim().split(/\s+/);
  const surname = parts.length>1 ? parts[parts.length-1] : parts[0];
  const given = parts.slice(0, Math.max(1,parts.length-1)).join(" ");
  const sex = genderOf(id.name)==="f" ? "F" : "M";
  const hgt = (5 + (seed%2)) + "'" + (seed%12) + '"';
  // a forged/stolen ID shows a DIFFERENT face than the person at the window
  const photo = `<canvas class="pxface" data-name="${c.idPhotoName || who}"></canvas>`;

  if(/Passport/i.test(id.type)){
    const issue = (parseInt(id.exp.slice(0,4))-10) + id.exp.slice(4); // issued ~10 yrs before expiry
    const mrz1 = ("P<USA"+(surname+"<<"+given.replace(/\s+/g,"<")).toUpperCase().replace(/[^A-Z<]/g,"")).padEnd(44,"<").slice(0,44);
    const mrz2 = (ppNo+"<USA<"+id.dob.replace(/-/g,"").slice(2)+sex+id.exp.replace(/-/g,"").slice(2)).toUpperCase().replace(/[^A-Z0-9<]/g,"").padEnd(44,"<").slice(0,44);
    return `
    <div class="iddoc pp">
      <div class="pp-page">
        <div class="pp-head">
          <div class="pp-seal">★</div>
          <div class="pp-titles"><div class="pp-country">United States of America</div><div class="pp-kind">Passport · Passeport · Pasaporte</div></div>
          <div class="pp-type">TYPE<br><b>P</b></div>
        </div>
        <div class="pp-body">
          <div class="idphoto pp-photo">${photo}</div>
          <div class="pp-fields">
            <div class="ppf"><span class="k">Code / Passport No.</span><span class="v">USA &nbsp; ${ppNo}</span></div>
            <div class="ppf"><span class="k">Surname</span><span class="v cmp" data-key="name" data-val="${id.name}">${surname.toUpperCase()}${matchFlag}</span></div>
            <div class="ppf"><span class="k">Given Names</span><span class="v">${given.toUpperCase()}</span></div>
            <div class="ppf"><span class="k">Nationality</span><span class="v">UNITED STATES OF AMERICA</span></div>
            <div class="ppf two">
              <span><span class="k">Date of Birth</span><span class="v cmp" data-key="dob" data-val="${id.dob}">${id.dob}</span></span>
              <span><span class="k">Sex</span><span class="v">${sex}</span></span>
              <span><span class="k">Issue</span><span class="v">${issue}</span></span>
            </div>
            <div class="ppf"><span class="k">Date of Expiry</span><span class="v">${id.exp}${expFlag}</span></div>
            <div class="ppf"><span class="k">Authority</span><span class="v">U.S. DEPARTMENT OF STATE</span></div>
          </div>
          <div class="pp-ghost"><canvas class="pxface" data-name="${c.idPhotoName || who}"></canvas></div>
        </div>
        <div class="mrz">${mrz1}<br>${mrz2}</div>
      </div>
    </div>`;
  }

  // Driver License / State ID card
  const kind = /State/i.test(id.type) ? "IDENTIFICATION CARD" : "DRIVER LICENSE";
  return `
    <div class="iddoc dl">
      <div class="dl-top"><span class="dl-flag">★</span><span class="dl-state">STATE OF COLUMBIA</span><span class="dl-kind">${kind}</span></div>
      <div class="dl-body">
        <div class="idphoto dl-photo">${photo}</div>
        <div class="dl-fields">
          <div class="dlf"><span class="k">${/State/i.test(id.type)?"ID":"DLN"}</span><span class="v">${dln}</span></div>
          <div class="dlf"><span class="k">LN</span><span class="v cmp" data-key="name" data-val="${id.name}">${surname}${matchFlag}</span></div>
          <div class="dlf"><span class="k">FN</span><span class="v">${given}</span></div>
          <div class="dlf"><span class="k">DOB</span><span class="v cmp" data-key="dob" data-val="${id.dob}">${id.dob}</span></div>
          <div class="dlf two"><span><span class="k">SEX</span> <span class="v">${sex}</span></span><span><span class="k">HGT</span> <span class="v">${hgt}</span></span><span><span class="k">CLASS</span> <span class="v">C</span></span></div>
          <div class="dlf"><span class="k">EXP</span><span class="v">${id.exp}${expFlag}</span></div>
        </div>
        <div class="dl-seal">◎</div>
      </div>

function submitForm(act){

const ACT_LABEL = { APPROVE:"APPROVED", CTR:"CTR FILED", SAR:"SAR FILED", BLOCK:"BLOCKED" };

function decide(act, sar){
  if(!state.awaiting) return;
  state.awaiting = false;
  clockStop();
  const c = state.queue[state.caseIdx];
  // some cases accept more than one disposition (e.g. an identity problem can be a Block OR a SAR)
  let correct = (act===c.correct) || !!(c.also && c.also.includes(act));
  const sarAcceptable = (c.correct==="SAR") || !!(c.also && c.also.includes("SAR"));

  // ---- SAR red flags are informational: filing the correct disposition always counts.
  // The flag selection just gets a coaching note — it never fails the case or adds a strike.
  let flagNote = "";
  if(act==="SAR" && sar && sar.flagIdx && sarAcceptable && (c.flags||[]).length){
    const want = c.flags;
    const hit = sar.flagIdx.some(i=>want.includes(i));
    const allRight = sar.flagIdx.every(i=>want.includes(i));
    if(allRight){
      flagNote = `<div class="hint">✓ Red flags correctly identified.</div>`;
    } else if(hit){
      flagNote = `<div class="hint">✓ Key red flag caught. The fullest set here: ${want.map(i=>SAR_FLAGS[i]).join("; ")}.</div>`;
    } else {
      flagNote = `<div class="hint">✓ SAR filed. Tip — the most fitting red flags here were: ${want.map(i=>SAR_FLAGS[i]).join("; ")}.</div>`;
    }
  }

  // verdict slam
  sfx("stamp");
  verdict.textContent = correct ? "CORRECT" : "VIOLATION";
  verdict.className = "verdict show "+(correct?"good":"bad");
  setTimeout(()=>verdict.classList.remove("show"), 700);

  let bonusLine = "";
  if(correct){
    state.pay += EARN;
    state.streak = (state.streak||0) + 1;
    sfx("good"); sfx("cash");
    // most-wanted bounty: blocking the day's flagged target pays extra
    if(act==="BLOCK" && state.bolo && c.id.name===state.bolo && !state.boloCaught){
      state.boloCaught = true; state.pay += BOLO_BONUS; unlock("bounty");
      bonusLine = `<div class="hint" style="color:#9bdc6e">🎯 Most-Wanted bounty — +${money(BOLO_BONUS)} for blocking ${c.id.name}.</div>`;
    }
    if(state.streak===10){ unlock("streak10"); floatToast(`<span class="ach-i">🔥</span><div><div class="ach-toast-t">Hot streak</div><div class="ach-toast-d">10 correct calls in a row!</div></div>`); }
    if(bumpStat("correct")>=50) unlock("clean50");
  } else {
    state.strikes += 1;
    state.pay -= FINE;
    state.streak = 0;
    sfx("bad");
  }
  updateStats();
  renderActions(true);

  const misfiled = (!correct && act==="SAR" && sarAcceptable); // SAR was acceptable but flags were wrong
  // remember this decision for the surprise audit and the ending
  state.history.push({ day:state.day, name:c.id.name, act, correctAct:c.correct, correct, misfiled, ring:c.ring||null });
  const docLine = sar ? `<div class="hint">${sar.icon||"📄"} ${sar.ref} filed — ${sar.detail}.</div>` : "";
  const fb = document.createElement("div");
  fb.className = "feedback "+(correct?"good":"bad");
  fb.innerHTML = `
    <b>${correct ? "✓ Correct disposition"
        : misfiled ? "✗ SAR misfiled — right call, wrong red flags"
        : "✗ Citation issued — "+ACT_LABEL[act]+", should have been "+ACT_LABEL[c.correct]}</b>
    ${c.reason}
    ${docLine}
    ${flagNote}
    ${correct?`<div class="hint">+$${EARN} commission.${state.streak>=3?` · 🔥 ${state.streak} in a row`:""}</div>`:`<div class="hint">−$${FINE} fine · +1 strike.</div>`}
    ${bonusLine}
    <div style="margin-top:10px"><button class="next" id="nextBtn">${isLastCase()?'End Day ▸':'Next Customer ▸'}</button><span class="learn-link" onclick="openLearn()">📖 Learn the rule ▸</span></div>
  `;
  booth.prepend(fb);
  booth.scrollTop = 0;
  el("nextBtn").addEventListener("click", advance);

  if(state.strikes>=MAX_STRIKES){
    setTimeout(gameOver, 50);
  }
}

let cmpSel = null;
function enableCompare(){
  cmpSel = null;
  booth.querySelectorAll(".cmp").forEach(elm=>{
    elm.addEventListener("click",()=>{
      if(!state.awaiting) return;
      if(cmpSel===elm){ elm.classList.remove("cmp-sel"); cmpSel=null; return; }
      if(!cmpSel){ cmpSel=elm; elm.classList.add("cmp-sel"); return; }
      const sameKey = cmpSel.dataset.key===elm.dataset.key;
      const match = sameKey && cmpSel.dataset.val.trim().toLowerCase()===elm.dataset.val.trim().toLowerCase();
      const cls = !sameKey ? "cmp-bad" : (match?"cmp-ok":"cmp-bad");
      [cmpSel,elm].forEach(x=>{ x.classList.remove("cmp-sel"); x.classList.add(cls);
        setTimeout(()=>x.classList.remove("cmp-ok","cmp-bad"),1300); });
      cmpToast(!sameKey ? "Compare like fields (name↔name, DOB↔DOB)" : (match?"✓ MATCH":"✗ MISMATCH"), match&&sameKey);
      cmpSel=null;
    });
  });
}
function cmpToast(msg, good){
  const g=el("game");
  let t=g.querySelector(".cmp-toast"); if(t) t.remove();
  t=document.createElement("div"); t.className="cmp-toast "+(good?"good":"bad"); t.textContent=msg;
  g.appendChild(t); setTimeout(()=>t.remove(),1300);
}

function advance(){
  if(state.over || advancing){ return; } // ignore repeat / double clicks — this caused the freeze
  advancing = true;
  const nb = el("nextBtn"); if(nb){ nb.disabled = true; }
  if(isLastCase()){ advancing = false; endDay(); return; }
  // let the current customer linger at the window, THEN walk off, then bring in the next
  const cust = booth.querySelector(".customer");
  if(cust){
    const dossier = booth.querySelector(".dossier");
    const fb = booth.querySelector(".feedback");
    // hold at the window for a beat before leaving
    setTimeout(()=>{
      cust.classList.remove("walking");

      if(dossier){ dossier.classList.add("hidden"); sfx("paper"); }
      if(fb){ fb.style.opacity = ".3"; }
      setTimeout(()=>{ state.caseIdx++; renderCase(); advancing = false; }, 1100);

  }
}

function achGridHtml(){
  const s=loadAch();
  return `<div class="ach-grid">`+ACHIEVEMENTS.map(a=>`<div class="ach ${s.has(a.id)?'on':''}" title="${a.desc}"><span class="ach-i">${a.icon}</span><span class="ach-t">${a.title}</span></div>`).join("")+`</div>`;
}
function floatToast(html){
  const g=el("game"); const t=document.createElement("div"); t.className="ach-toast"; t.innerHTML=html;
  g.appendChild(t); setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),400); }, 2600);
}

/* ---- End-of-run screen: enter your name, then see the leaderboard ------ */
let runRecorded=false;
function endRun(opts){
  state.over=true; advancing=false; clockStop(); clearInterval(clockTimer);
  runRecorded=false;
  renderEndOverlay(opts, null);
}
function renderEndOverlay(opts, result){
  const day=state.day, pay=state.pay;
  const section = result
    ? `<div class="lb-wrap"><h3>★ LEADERBOARD ★</h3><div data-board="10" data-hl="${result.entry.ts}">${boardRows(BOARD, result.entry.ts)}</div></div>`
    : `<div class="score-entry">
         <p>You reached <b style="color:#9bdc6e">Day ${day}</b> · balance <b style="color:#cBa24a">${money(pay)}</b></p>
         <div class="se-row"><input id="initials" maxlength="12" placeholder="ENTER NAME" autocomplete="off" spellcheck="false"/><button class="cta" id="saveScore">Save</button></div>
       </div>`;
  showOverlay(`
    <div class="big">${opts.icon}</div>
    <h1 style="color:${opts.color}">${opts.title}</h1>
    <h2>${opts.subtitle}</h2>
    ${opts.body||""}
    ${section}
    <div class="end-actions"><button class="cta${result?'':' alt'}" id="retryBtn">${opts.cta||"Play Again"}</button></div>
  `);
  el("retryBtn").addEventListener("click", startGame);
  if(!result){
    const inp=el("initials");
    const save=async()=>{ if(runRecorded) return; runRecorded=true;
      const btn=el("saveScore"); if(btn){ btn.disabled=true; btn.textContent=sbOn()?"Saving…":"Save"; }
      const r=await addScore(inp?inp.value:"", day, pay); renderEndOverlay(opts, r); };
    el("saveScore").addEventListener("click", save);
    if(inp){ inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); save(); } }); setTimeout(()=>inp.focus(),60); }
  }
}

/* ---- The BSA Officer: praises a clean day, scolds a strike, rages if fired */
const BOSS = {
  name:"BSA OFFICER DONOVAN",
  proud:[
    "Flawless sheet today. Keep this up and the examiners never darken our door.",
    "Not one miss. That is the standard. The Bank sleeps easy tonight.",
    "Clean as a whistle. You're the reason we still have a charter.",
    "Textbook work. I'm putting a note in your file — the good kind.",
    "Sharp eyes all day. This is what compliance is supposed to look like.",
    "Spotless. The regulators would be bored watching you. I love it.",
  ],
  sad:[
    "A citation today. I expected better — every miss is a fine waiting to happen.",
    "Sloppy. Regulators don't grade on a curve. Tighten it up tomorrow.",
    "That slip could've cost us the charter. Don't make me say it twice.",
    "Disappointing. One launderer through that window and it's my head too.",
    "We can't afford mistakes like that. Read the manual again tonight.",
  ],
  fired:"FOUR strikes?! Clean out your desk. You've put this entire bank — and my career — at risk. Get out.",
};
function bossBlock(mood){
  const msg = mood==="fired" ? BOSS.fired
            : (mood==="proud" ? BOSS.proud : BOSS.sad)[state.day % (mood==="proud"?BOSS.proud.length:BOSS.sad.length)];
  return `<div class="boss ${mood}">
    <div class="boss-portrait"><canvas class="pxface" data-name="Chief Donovan"></canvas></div>
    <div class="boss-speech"><div class="boss-name">${BOSS.name}</div>"${msg}"</div>
  </div>`;
}

function startGame(){
  state.day=1; state.caseIdx=0; state.pay=0; state.strikes=0;
  state.used = new Set(); state.over = false; advancing = false;
  state.corruption=0; state.missed=0; state.timeLeft=0; state.clockOn=false;
  state.history=[]; state.audited=false;
  state.streak=0; state.news=""; state.bolo=null; state.boloCaught=false;
  state.paused=false; el("pause").classList.remove("show");
  clearInterval(clockTimer);
  renderManual(); renderWatchlist();
  beginDay();
}

function beginDay(){
  state.caseIdx=0; advancing=false; state.missed=0;
  state.dayStartStrikes = state.strikes; // to tell if a strike happened today
  state.queue = buildQueue(state.day);
  // daily flavor: a news headline, and (once sanctions are in play) a most-wanted bounty
  state.news = newsFor();
  state.boloCaught = false;
  // only flag a most-wanted whose case can actually appear by today, so the bounty is winnable
  const eligible = state.day>=2 ? BOLO_POOL.filter(n=>CASES.some(c=>c.id.name===n && c.minDay<=state.day)) : [];
  state.bolo = eligible.length ? eligible[Math.floor(Math.random()*eligible.length)] : null;
  if(state.bolo && !state.queue.some(c=>c.id.name===state.bolo)){
    // make sure the day's most-wanted actually walks up at least once
    const cand = CASES.find(c=>c.id.name===state.bolo && c.minDay<=state.day);
    if(cand){ state.used.add(cand.name); state.queue.splice(Math.floor(Math.random()*(state.queue.length+1)), 0, cand); }
  }
  // milestone / persistence achievements
  if(state.day>=10) unlock("day10");
  if(state.day>=15) unlock("day15");
  renderManual(); renderWatchlist(); updateStats();
  // surprise regulator audit lands once, at the start of the audit day
  if(state.day===AUDIT_DAY && !state.audited && state.history.length>=3){
    state.audited = true; regulatorAudit(showDayIntro);
  } else {
    showDayIntro();
  }
}
function showDayIntro(){
  showOverlay(`
    <div class="big">🗂️</div>
    <h1>DAY ${state.day}</h1>
    <h2>${dayTitle(state.day)}</h2>
    <p>${dayIntro(state.day)}</p>
    ${state.news?`<div class="news">📰 <b>WIRE:</b> ${state.news}</div>`:""}
    ${state.bolo?`<div class="bolo">⚠ <b>MOST WANTED TODAY:</b> ${state.bolo} — ${watchNote(state.bolo)}. Block them for a <b>+${money(BOLO_BONUS)}</b> bounty.</div>`:""}
    <p class="hint" style="max-width:520px">⏱ The clock ticks only while a customer waits for your decision — be accurate, but don't dawdle.<br>🖱 Click a stamp to apply it. Click an ID field and the matching account field to compare them. Keys 1–4 stamp; M mutes.</p>
    <button class="cta" id="goBtn">Open Window</button>
  `);
  el("goBtn").addEventListener("click",()=>{ hideOverlay(); startShiftClock(); renderCase(); });
}

/* ---- Surprise regulator audit: re-grades your earlier filings ---------- */
function examinerBlock(msg){
  return `<div class="boss sad">
    <div class="boss-portrait"><canvas class="pxface" data-name="Examiner Reed"></canvas></div>
    <div class="boss-speech"><div class="boss-name">FEDERAL EXAMINER REED</div>"${msg}"</div>
  </div>`;
}
function regulatorAudit(onDone){
  const wrongs  = state.history.filter(h=>!h.correct);
  const reported = wrongs.slice(0,5);
  const fine = reported.length*300;
  state.pay -= fine;
  updateStats();
  sfx(reported.length ? "bad" : "good");

  let body, msg;
  if(reported.length===0){
    state.pay += 500; updateStats();
    msg = "I pulled your filings at random. Spotless. The Bureau will hear good things.";
    body = `<p>The examiner reviews <b>${state.history.length}</b> of your filings and finds <b>no deficiencies</b>.<br>Commendation: <b style="color:#9bdc6e">+$500</b>.</p>`;
  } else {
    msg = "I found problems in your file. These are formal findings. The fines are real.";
    const rows = reported.map(h=>{
      const txt = h.misfiled ? `SAR misfiled — wrong red flags`
                : `you ${ACT_LABEL[h.act]}, should have been ${ACT_LABEL[h.correctAct]}`;
      return `<div style="display:flex;justify-content:space-between;gap:10px"><span>Day ${h.day} · ${h.name}</span><span class="strike">${txt}</span></div>`;
    }).join("");
    body = `<p>The examiner pulls your record and issues findings:</p>
      <div class="ledger-summary">
        ${rows||"<div>No filing errors.</div>"}
        <div class="ls-total" style="display:flex;justify-content:space-between"><span>Regulatory fine</span><span class="strike">−${money(fine)}</span></div>
      </div>`;
  }
  showOverlay(`
    <div class="big">🔍</div>
    <h1 style="color:#cBa24a">SURPRISE AUDIT</h1>
    <h2>A federal examiner is on site</h2>
    ${examinerBlock(msg)}
    ${body}
    <button class="cta" id="auditBtn">Back to work</button>
  `);
  el("auditBtn").addEventListener("click", onDone);
}

function endDay(timedOut){
  clockStop();
  const struckToday = state.strikes - (state.dayStartStrikes||0);
  unlock("firstday");
  if(struckToday===0 && !timedOut) unlock("spotless");
  const bills = billsFor(state.day);
  const before = state.pay;
  state.pay -= bills.total;           // pay the day's expenses
  const broke = state.pay < 0;
  updateStats();
  if(broke){ return evictionOver(bills, before); }
  const billRows = bills.items.map(([n,v])=>`<div style="display:flex;justify-content:space-between"><span>${n}</span><span>−${money(v)}</span></div>`).join("");
  const nextDay = state.day+1;
  const harderNote = nextDay>6
    ? `<p class="hint">⚠ Day ${nextDay}: ${casesForDay(nextDay)} customers, ${secPerCase(nextDay)}s each — it only gets harder from here.</p>` : "";
  showOverlay(`
    <div class="big">🌙</div>
    <h1>END OF DAY ${state.day}</h1>
    <h2>${dayTitle(state.day)} ${timedOut?"— shift over (clock ran out)":"complete"}</h2>
    ${timedOut&&state.missed>0?`<p class="strike">${state.missed} customer(s) left unserved — lost income.</p>`:""}
    <div class="ledger-summary">
      <div style="display:flex;justify-content:space-between"><b>Earnings</b><b>${money(before)}</b></div>
      ${billRows}
      <div class="ls-total" style="display:flex;justify-content:space-between"><b>Balance</b><b>${money(state.pay)}</b></div>
    </div>
    <p>Strikes: <b class="strike">${state.strikes}/${MAX_STRIKES}</b>${struckToday>0?` · <span class="strike">${struckToday} today</span>`:""}</p>
    ${harderNote}
    ${bossBlock(struckToday>0 ? "sad" : "proud")}
    <button class="cta" id="nextDayBtn">Begin Day ${state.day+1}</button>
  `);
  el("nextDayBtn").addEventListener("click",()=>{ state.day++; beginDay(); });
}

function evictionOver(bills, before){
  endRun({
    icon:"🏚️", color:"#a8452f",
    title:"EVICTED", subtitle:"You couldn't cover this month's bills",
    body:`<p>Earnings ${money(before)} − expenses ${money(bills.total)} = <b class="strike">${money(state.pay)}</b>. Every missed or botched case is money out of your family's pocket.</p>`,
    cta:"Start Over"
  });
}

function gameOver(){
  endRun({
    icon:"📦", color:"#a8452f",
    title:"TERMINATED", subtitle:"Too many compliance violations",
    body:`<p>You reached ${MAX_STRIKES} strikes on Day ${state.day}. Security escorted you out and the Bank's regulator has been notified. In the real world, AML failures draw multimillion-dollar fines and personal liability for compliance officers.</p>${bossBlock("fired")}`,
    cta:"Reapply (Restart)"
  });
}

/* ---- Title screen ------------------------------------------------------ */
function titleScreen(){
  const best = bestDay();
  showOverlay(`
    <div class="big">🛂💵</div>
    <h1>Know Your Customer</h1>
    <h2>An Anti-Money-Laundering Inspection Game</h2>
    <p>You are a <b>BSA/AML Compliance Officer</b>. Customers slide documents under your window. Inspect the ID, the account, and the transaction — then stamp the correct disposition:
    <br><br>
    ✅ <b>Approve</b> · 📄 <b>File CTR</b> (cash over $10,000) · 🚩 <b>File SAR</b> (suspicious) · ⛔ <b>Block</b> (sanctions / failed KYC).
    <br><br>
    New rules unlock through Day 6 — then the shift <b>never ends</b>: each day brings more customers and less time. ${MAX_STRIKES} strikes (or going broke) and you're out. <b>Reach the highest day to top the leaderboard.</b></p>
    ${best?`<p class="hint">Best so far: <b style="color:#9bdc6e">Day ${best}</b></p>`:""}
    <div class="lb-wrap"><h3>★ TOP OFFICERS ★</h3><div data-board="5">${boardRows(BOARD.slice(0,5))}</div></div>
    <div class="lb-wrap"><h3>★ ACHIEVEMENTS ★</h3>${achGridHtml()}</div>
    <button class="cta" id="startBtn">Report for Duty</button>
  `);
  el("startBtn").addEventListener("click", startGame);
  refreshBoard(); // pull the latest global scores and repaint the top-5
}

/* ---- Sidebar tab switching --------------------------------------------- */
document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    sfx("click");
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tabcontent").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    el("tab-"+btn.dataset.tab).classList.add("active");
  });
});

/* ---- Audio unlock + mute + keyboard shortcuts -------------------------- */
document.addEventListener("pointerdown", audioInit);
el("muteBtn").addEventListener("click", ()=>{ audioInit(); setMuted(!muted); });
el("pauseBtn").addEventListener("click", togglePause);
el("resumeBtn").addEventListener("click", resumeGame);
document.addEventListener("keydown",(e)=>{
  audioInit();
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;   // don't hijack form typing
  const k=e.key.toLowerCase();
  if(k==="p"){ togglePause(); return; }
  if(state.paused) return;                                     // everything else is frozen while paused
  if(k==="m"){ setMuted(!muted); return; }
  if(overlay.style.display==="flex"){                          // an overlay (day/end/title) is up
    if(e.key==="Enter"){ const b=overlay.querySelector("button"); if(b) b.click(); }
    return;
  }
  if(sarModal.classList.contains("show")){                     // a paperwork form is open
    if(e.key==="Enter"){ const b=el("fSubmit")||el("ofacSend"); if(b) b.click(); }
    return;
  }
  const nb=el("nextBtn");                                       // feedback shown → advance
  if(nb && (e.key==="Enter"||k==="n")){ nb.click(); return; }
  if(state.awaiting){                                           // stamps 1-4
    const map={"1":"APPROVE","2":"CTR","3":"SAR","4":"BLOCK"};
    if(map[k]){ const btn=actionsBar.querySelector(`[data-act="${map[k]}"]`); if(btn) btn.click(); }
  }
});

renderManual(); renderWatchlist(); renderLearn();
titleScreen();
</script>
