<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Negative News — Due Diligence Search</title>
<style>
  :root{
    --gblue:#4285F4; --gred:#EA4335; --gyellow:#FBBC05; --ggreen:#34A853;
    --link:#1a0dab; --visited:#681da8; --url:#202124; --crumb:#5f6368;
    --snip:#4d5156; --line:#dadce0; --chip:#f1f3f4; --chiptext:#3c4043;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#fff;color:#202124;
    font-family:arial,"Helvetica Neue",Helvetica,sans-serif;font-size:14px;}
  .topbar{display:flex;align-items:center;gap:22px;padding:18px 24px 0;border-bottom:1px solid var(--line);}
  .logo{font-size:24px;font-weight:500;letter-spacing:-1px;white-space:nowrap;padding-bottom:18px;}
  .logo .b{color:var(--gblue);}.logo .r{color:var(--gred);}.logo .y{color:var(--gyellow);}
  .logo .g{color:var(--ggreen);}
  .searchwrap{flex:1;max-width:620px;padding-bottom:18px;}
  .searchbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:24px;
    padding:9px 18px;box-shadow:0 1px 6px rgba(32,33,36,.12);}
  .searchbox:hover{box-shadow:0 1px 6px rgba(32,33,36,.28);}
  .searchbox input{border:0;outline:0;flex:1;font-size:16px;color:#202124;background:transparent;}
  .searchbox .icons{color:var(--gblue);font-size:18px;}
  .tabs{display:flex;gap:26px;padding:0 24px;margin-top:8px;color:var(--crumb);font-size:13px;}
  .tabs .t{padding:10px 0;border-bottom:3px solid transparent;}
  .tabs .t.active{color:var(--gblue);border-bottom-color:var(--gblue);font-weight:500;}
  .layout{display:flex;gap:40px;padding:18px 24px 60px;max-width:1100px;}
  .results{max-width:620px;flex:1;}
  .stats{color:var(--crumb);font-size:13px;margin-bottom:18px;}
  .result{margin-bottom:26px;}
  .result .crumbs{display:flex;align-items:center;gap:8px;color:var(--url);font-size:12px;line-height:1.3;}
  .result .crumbs .fav{width:26px;height:26px;border-radius:50%;background:var(--chip);
    display:flex;align-items:center;justify-content:center;color:var(--crumb);font-weight:bold;font-size:13px;}
  .result .site{display:flex;flex-direction:column;}
  .result .site .name{color:var(--url);font-size:14px;}
  .result .site .url{color:var(--crumb);font-size:12px;}
  .result h3{margin:4px 0 2px;font-size:20px;line-height:1.3;font-weight:400;color:var(--link);cursor:pointer;}
  .result h3:hover{text-decoration:underline;}
  .result.tagged h3{color:var(--visited);}
  .result .snip{color:var(--snip);font-size:14px;line-height:1.58;}
  .result .snip .date{color:var(--crumb);}
  .tagrow{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .tagrow .lbl{color:var(--crumb);font-size:12px;}
  .chip{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:16px;
    padding:4px 14px;font-size:12px;color:var(--chiptext);}
  .chip:hover{background:var(--chip);}
  .chip.on.relevant{background:#fce8e6;border-color:#ea4335;color:#a50e0e;font-weight:bold;}
  .chip.on.irrelevant{background:#e8eaed;border-color:#bdc1c6;color:#202124;font-weight:bold;}
  .locked{border:1px dashed var(--line);border-radius:8px;padding:14px;margin-bottom:24px;color:var(--crumb);
    display:flex;align-items:center;justify-content:space-between;}
  .locked button{border:0;background:none;color:var(--gblue);cursor:pointer;font-size:14px;}
  .panel{width:330px;border:1px solid var(--line);border-radius:10px;padding:18px;height:fit-content;}
  .panel h2{margin:0 0 2px;font-size:22px;font-weight:400;}
  .panel .ksub{color:var(--crumb);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px;}
  .panel .row{display:flex;margin:7px 0;font-size:13px;}
  .panel .row .k{color:var(--crumb);min-width:120px;}
  .standard{background:#fef7e0;border:1px solid #fbbc05;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;color:#7a5b00;}
  .dispo-wrap{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:8px;background:#f8f9fa;}
  .dispo-wrap .ttl{font-size:13px;color:var(--crumb);margin-bottom:10px;font-weight:bold;letter-spacing:.3px;}
  .dispo{display:flex;flex-direction:column;gap:8px;}
  .dispo button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;font-size:15px;color:#202124;}
  .dispo button:hover{background:var(--chip);}
  .dispo button.sel.yes{border-color:var(--gred);background:#fce8e6;color:#a50e0e;font-weight:bold;}
  .dispo button.sel.no{border-color:var(--ggreen);background:#e6f4ea;color:#137333;font-weight:bold;}
  .signoff{margin-top:12px;width:100%;background:var(--gblue);color:#fff;border:0;border-radius:8px;padding:12px;
    font-size:15px;cursor:pointer;font-weight:500;}
  .signoff:disabled{background:#dadce0;color:#fff;cursor:not-allowed;}
  .fb{border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px;}
  .fb h3{margin:0 0 8px;font-weight:500;}
  .good{color:var(--ggreen);} .bad{color:var(--gred);} .mid{color:#b06000;}
  .truth{background:#f8f9fa;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px;}
  .teach{border-left:3px solid var(--gblue);padding-left:12px;color:var(--crumb);font-style:italic;font-size:13px;margin:8px 0;}
  .keyrow{font-size:12px;margin:3px 0;color:var(--snip);}
  .nextbtn{margin-top:14px;background:var(--gblue);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer;}
  .center{text-align:center;}
  @media(max-width:900px){.layout{flex-direction:column;}.panel{width:100%;}}
  /* browser-style tabs */
  .browserbar{display:flex;align-items:stretch;background:#dee1e6;border-bottom:1px solid var(--line);padding:6px 8px 0;gap:6px;}
  .btab{background:#f1f3f4;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;padding:8px 16px;font-size:13px;color:#3c4043;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .btab.active{background:#fff;font-weight:bold;}
  .btab.ofac{color:#0b3d91;}
  .warn{display:inline-block;background:var(--gred);color:#fff;border-radius:50%;width:16px;height:16px;text-align:center;line-height:16px;font-size:11px;font-weight:bold;}
  .bmeta{margin-left:auto;align-self:center;color:#b06000;font-size:13px;padding-right:8px;}
  .main{max-width:650px;flex:1;}
  .webhdr{display:flex;align-items:center;gap:22px;margin-bottom:14px;}
  /* OFAC gov styling */
  .ofachdr{background:#0b3d91;color:#fff;padding:14px 18px;border-radius:6px 6px 0 0;}
  .ofactitle{font-size:20px;font-weight:bold;}
  .ofacsub{font-size:11px;opacity:.9;margin-top:3px;letter-spacing:.3px;}
  .ofacsearch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eef2f8;border:1px solid #c3d0e6;border-top:none;padding:12px 14px;font-size:13px;}
  .ofacsearch label{color:#0b3d91;font-weight:bold;}
  .ofacsearch input{border:1px solid #aab2c0;padding:5px 8px;border-radius:3px;font-size:13px;min-width:190px;}
  .ofacfield{background:#fff;border:1px solid #aab2c0;padding:5px 8px;border-radius:3px;}
  .ofacbtn{background:#0b3d91;color:#fff;border:0;border-radius:3px;padding:6px 16px;opacity:.6;}
  .ofacempty{border:1px solid var(--line);border-top:none;padding:22px 16px;color:#137333;background:#f6fbf7;font-size:14px;}
  .ofacempty .muted{color:var(--crumb);font-size:12px;}
  .ofaccount{font-size:12px;color:#a50e0e;background:#fff5f5;border:1px solid #f3c2c2;border-top:none;padding:9px 12px;}
  .ofacgrid{display:grid;grid-template-columns:2fr 1fr 1.6fr .7fr .6fr;gap:8px;padding:8px 12px;font-size:13px;align-items:center;}
  .ofachead{background:#0b3d91;color:#fff;font-weight:bold;font-size:12px;border-radius:0;}
  .ofacrow{border:1px solid var(--line);border-top:none;}
  .ofacname{color:#0b3d91;font-weight:bold;}
  .ofacscore{font-weight:bold;}
  .ofacdetail{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:4px 12px 10px;font-size:12px;color:var(--snip);background:#fafbfc;}
  .ofacdetail .k{color:var(--crumb);display:inline-block;min-width:96px;}
  .ofacrow .tagrow{padding:2px 12px 12px;}
  .chip.on.ofac-match{background:#fce8e6;border-color:#ea4335;color:#a50e0e;font-weight:bold;}
  .chip.on.ofac-nomatch{background:#e6f4ea;border-color:#34a853;color:#137333;font-weight:bold;}
  .gate{background:#fff5f5;border:1px solid #f3c2c2;color:#a50e0e;font-size:12px;padding:8px 10px;border-radius:6px;margin-top:10px;}
  /* intro / briefing */
  .intro{max-width:780px;margin:26px auto;padding:0 16px;}
  .intro h1{font-size:26px;font-weight:500;margin:0 0 6px;}
  .intro .lead{color:var(--snip);font-size:15px;margin:0 0 18px;line-height:1.5;}
  .checkrow{display:flex;gap:16px;flex-wrap:wrap;}
  .checkcard{flex:1;min-width:300px;border:1px solid var(--line);border-radius:10px;padding:16px;}
  .checkcard.ofaccard{border-color:#0b3d91;}
  .checkcard h3{margin:0 0 8px;font-size:16px;}
  .checkcard ul{margin:0;padding-left:18px;color:var(--snip);font-size:13px;line-height:1.65;}
  .rulebox{background:#fef7e0;border:1px solid #fbbc05;border-radius:10px;padding:14px 16px;margin:18px 0;font-size:14px;color:#7a5b00;line-height:1.5;}
  .scorenote{color:var(--crumb);font-size:13px;margin:0 0 18px;}
  .startbtn{background:var(--gblue);color:#fff;border:0;border-radius:8px;padding:13px 30px;font-size:16px;cursor:pointer;font-weight:500;}
  /* pressure + stakes + juice */
  .statchip{margin-left:14px;}
  .clock{font-weight:bold;}
  .clock.low{color:var(--gred);}
  .stamp{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);font-size:58px;font-weight:bold;
    letter-spacing:2px;border:7px solid;border-radius:12px;padding:14px 34px;background:rgba(255,255,255,.72);
    text-transform:uppercase;pointer-events:none;z-index:999;animation:stamp 1.1s ease-out forwards;}
  @keyframes stamp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(2.8) rotate(-22deg);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(.92) rotate(-11deg);}
    30%{transform:translate(-50%,-50%) scale(1.03) rotate(-11deg);}
    40%{transform:translate(-50%,-50%) scale(1) rotate(-11deg);}
    82%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-11deg);}
  }
  .strikebar{background:#a50e0e;color:#fff;padding:8px 12px;border-radius:6px;font-weight:bold;margin-bottom:10px;}
  .falsebar{background:#fff5f5;border:1px solid #f3c2c2;color:#a50e0e;padding:8px 12px;border-radius:6px;margin-bottom:10px;}
  .streakbar{background:#e6f4ea;border:1px solid #34a853;color:#137333;padding:8px 12px;border-radius:6px;font-weight:bold;margin-bottom:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>

// A case is "NEGATIVE NEWS" if it has >=1 relevant:true hit, else "NO NEGATIVE NEWS".

    teach:"A dismissed civil suit and a wrong-person DUI are not negative news. Resolved-with-no-finding and same-name-different-person both fail the bar.",
    hits:[
      {h:"Dr. Sarah Whitfield Named Among Region's Top Doctors",s:"Health Beat",d:"2024-04",det:"Recognized for pediatric care.",relevant:false},
      {h:"Malpractice Suit Against Dr. Whitfield Dismissed",s:"Tribune Daily",d:"2022-09",det:"A court dismissed the claim for lack of merit.",relevant:false},
      {h:"Sarah Whitfield, 22, Cited for DUI in Nevada",s:"Meridian Wire",d:"2023-06",det:"A 22-year-old (born ~2001) cited in Reno; no medical profession noted.",relevant:false},

  { name:"Tomás Herrera",

  { name:"Olivia Brand",
    profile:[["DOB","1990-11-27"],["Country","USA (San Francisco)"],["Occupation","Tech founder"]],
    truth:"No negative news. The investor lawsuit alleges poor management of a failed startup — a civil business dispute, not fraud or crime. The realtor hit is a different person.",

// ---------- OFAC simulated SDN data (all fictional) ----------
// A result is a TRUE hit only if the name matches AND it is the SAME PERSON
// (identifiers — DOB / nationality — match the customer file). isMatch encodes that.
const OFAC = {
  "Gregor Vance":[
    {name:"WANCEL, Grzegorz", aka:"'VANCE, Gregor'", type:"Individual", programs:"SAINT-AUREL-EO14024", list:"SDN", score:100, dob:"30 Jan 1969", pob:"Saint Aurel", nat:"United Kingdom; Saint Aurel", isMatch:true},
  ],
  "Viktor Almaz":[
    {name:"ALMAZ, Viktor", type:"Individual", programs:"SAINT-AUREL-EO14024; GLOMAG", list:"SDN", score:100, dob:"14 Feb 1971", pob:"Saint Aurel", nat:"Saint Aurel", isMatch:true},
  ],
  "Rashid Kamau":[
    {name:"KAMAU, Rashid", type:"Individual", programs:"SDGT", list:"SDN", score:100, dob:"22 Apr 1977", pob:"(not listed)", nat:"(not listed)", isMatch:true},
  ],
  "Boris Kallan":[
    {name:"KALLANOV, Boris", aka:"'KALLAN, Boris'", type:"Individual", programs:"KAROVIA-EO14065", list:"SDN", score:100, dob:"05 Oct 1970", pob:"Karovia", nat:"Karovia", isMatch:true},
  ],
  "Hassan Al-Rashidi":[
    {name:"AL-RASHIDI, Hassan", type:"Individual", programs:"SDGT", list:"SDN", score:100, dob:"08 Mar 1969", pob:"(not listed)", nat:"(not listed)", isMatch:true},
  ],
  "John A. Martin":[
    {name:"MARTIN, John Edward", type:"Individual", programs:"SDNTK", list:"SDN", score:100, dob:"15 Mar 1962", pob:"Cali, Colombia", nat:"Colombia", isMatch:false},
  ],
  "Greg Thompson":[
    {name:"THOMPSON, Gregory Paul", type:"Individual", programs:"SDGT", list:"SDN", score:100, dob:"02 Jul 1959", pob:"Manchester, UK", nat:"United Kingdom", isMatch:false},
  ],
  "James Sullivan":[
    {name:"SULLIVAN, James", type:"Individual", programs:"SDGT", list:"SDN", score:100, dob:"20 Nov 1968", pob:"Dublin, Ireland", nat:"Ireland", isMatch:false},
  ],
  "Robert Klein":[
    {name:"KLEIN, Robert", type:"Individual", programs:"CYBER2", list:"SDN", score:100, dob:"12 Apr 1970", pob:"Munich, Germany", nat:"Germany", isMatch:false},
  ],
  "Elena Marković":[
    {name:"MARKOVIC, Elena", type:"Individual", programs:"VELMARA-EO14038", list:"SDN", score:100, dob:"17 Aug 1974", pob:"Velmara", nat:"Velmara", isMatch:true},
  ],
};
function ofacFor(c){ return OFAC[c.name] || []; }
function ofacTrueMatch(c){ return ofacFor(c).some(r=>r.isMatch); }

const TAGS = [["relevant","Negative news"],["irrelevant","Not relevant"]];
const OFAC_TAGS = [["match","Same person &mdash; MATCH"],["nomatch","Not the same person"]];

// ---------- STATE ----------
let idx = 0, score = 0, state = null, DECK = [];
let strikes = 0, streak = 0, best = 0, timer = null;
const CASE_TIME = 75;
function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function caseAnswer(c){ return (c.hits.some(h=>h.relevant) || ofacTrueMatch(c)) ? "YES" : "NO"; }

function startCase(){
  const c = DECK[idx];
  state = { tab:'web', tags:c.hits.map(()=>null), revealed:c.hits.map(h=>!h.deep),
            ofacTags:ofacFor(c).map(()=>null), ofacVisited:false, dispo:null, submitted:false,
            timeLeft:CASE_TIME, result:null };
  render();
  startTimer();
}

const app = document.getElementById("app");
function fav(src){ return src.replace(/[^A-Za-z]/g,"").slice(0,1).toUpperCase() || "?"; }
function urlify(src){ return src.toLowerCase().replace(/[^a-z]+/g,"")+".example"; }
function gLogo(){ return `<div class="logo"><span class="b">G</span><span class="r">o</span><span class="y">g</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></div>`; }

function render(){
  const c = DECK[idx];
  app.innerHTML = `
    ${tabBar(c)}
    <div class="layout">
      <div class="main">${state.tab==='web'?webMain(c):ofacMain(c)}</div>
      <div class="side">${sidePanel(c)}<div id="fbslot"></div></div>
    </div>`;
  if(state.submitted){ document.getElementById("fbslot").innerHTML = renderFeedback(c); }
}

function tabBar(c){
  const flag = state.ofacVisited ? "" : `<span class="warn">!</span>`;
  return `<div class="browserbar">
    <div class="btab ${state.tab==='web'?'active':''}" onclick="setTab('web')">&#128269; Goggle &mdash; "${c.name}"</div>
    <div class="btab ofac ${state.tab==='ofac'?'active':''}" onclick="setTab('ofac')">&#128737; OFAC Sanctions Search ${flag}</div>
    <div class="bmeta">Case ${idx+1}/${DECK.length}<span class="statchip">&#9201; <span id="clock" class="clock${state.timeLeft<=10?' low':''}">${fmt(state.timeLeft)}</span></span><span class="statchip">Strikes ${'&#10007;'.repeat(strikes)+'&#9675;'.repeat(3-strikes)}</span>${streak>=2?`<span class="statchip">&#128293; ${streak}</span>`:''}<span class="statchip">Score ${score}</span></div>
  </div>`;
}

function webMain(c){
  const total = c.hits.filter((h,i)=>state.revealed[i]).length;
  let h = `<div class="webhdr">${gLogo()}
    <div class="searchwrap"><div class="searchbox"><input value="${c.name}" readonly /><span class="icons">&#128269;</span></div></div></div>
    <div class="stats">About ${total} results &mdash; review each. (All names &amp; news are fictional.)</div>`;
  c.hits.forEach((hit,i)=>{
    if(!state.revealed[i]){
      h += `<div class="locked"><span>More results on a later page (costs 1 point to load).</span>
        <button onclick="reveal(${i})">Load more results &rsaquo;</button></div>`;
      return;
    }
    const t = state.tags[i];
    h += `<div class="result ${t?'tagged':''}">
      <div class="crumbs"><div class="fav">${fav(hit.s)}</div>
        <div class="site"><span class="name">${hit.s}</span><span class="url">https://${urlify(hit.s)} &rsaquo; article</span></div></div>
      <h3>${hit.h}</h3>
      <div class="snip"><span class="date">${hit.d} &mdash; </span>${hit.det}</div>
      <div class="tagrow"><span class="lbl">Your call:</span>
        ${TAGS.map(([key,label])=>`<span class="chip ${key} ${t===key?'on':''}" onclick="setTag(${i},'${key}')">${label}</span>`).join("")}
      </div>
    </div>`;
  });
  return h;
}

function ofacMain(c){
  const res = ofacFor(c);
  let h = `<div class="ofachdr">
      <div class="ofactitle">Sanctions List Search</div>
      <div class="ofacsub">U.S. Dept. of the Treasury &middot; Office of Foreign Assets Control &mdash; SIMULATED FOR TRAINING. All data fictional.</div>
    </div>
    <div class="ofacsearch">
      <label>Name</label><input value="${c.name}" readonly />
      <label>Type</label><span class="ofacfield">Individual</span>
      <label>Min Name Score</label><span class="ofacfield">100</span>
      <button class="ofacbtn" disabled>Search</button>
    </div>`;
  if(res.length===0){
    h += `<div class="ofacempty">Your search has returned <b>0 matches</b> for &ldquo;${c.name}&rdquo; at minimum name score 100.<br>
      <span class="muted">No SDN / Consolidated List entries. (Confirm spelling and any known aliases before clearing.)</span></div>`;
    return h;
  }
  h += `<div class="ofaccount">Lookup Results: <b>${res.length}</b> potential match(es). A name hit is NOT a true match by itself &mdash; verify each entry's identifiers against the customer file (right). It must be the SAME PERSON.</div>
    <div class="ofacgrid ofachead"><div>Name</div><div>Type</div><div>Program(s)</div><div>List</div><div>Score</div></div>`;
  res.forEach((r,i)=>{
    const t = state.ofacTags[i];
    h += `<div class="ofacrow">
      <div class="ofacgrid">
        <div class="ofacname">${r.name}</div><div>${r.type}</div><div>${r.programs}</div><div>${r.list}</div><div class="ofacscore">${r.score}</div>
      </div>
      <div class="ofacdetail">
        ${r.aka?`<div><span class="k">a.k.a.</span> ${r.aka}</div>`:`<div></div>`}
        <div><span class="k">DOB</span> ${r.dob}</div>
        <div><span class="k">Place of birth</span> ${r.pob}</div>
        <div><span class="k">Nationality</span> ${r.nat}</div>
      </div>
      <div class="tagrow"><span class="lbl">Same person?</span>
        ${OFAC_TAGS.map(([key,label])=>`<span class="chip ofac-${key} ${t===key?'on':''}" onclick="setOfac(${i},'${key}')">${label}</span>`).join("")}
      </div>
    </div>`;
  });
  return h;
}

function sidePanel(c){
  const ready = state.dispo && state.ofacVisited && !state.submitted;
  const gate = state.ofacVisited ? "" : `<div class="gate">&#9888; You must open the OFAC Sanctions Search tab before signing off.</div>`;
  return `<div class="panel">
      <h2>${c.name}</h2>
      <div class="ksub">Customer file &middot; verify identity against any match</div>
      ${c.profile.map(p=>`<div class="row"><span class="k">${p[0]}</span><span>${p[1]}</span></div>`).join("")}
      <div class="standard"><b>Standard:</b> "Negative news" counts only if <b>confirmed to be THIS person</b> AND a <b>serious risk</b>. An OFAC hit counts only if the name is an exact match AND the identifiers (DOB, nationality) match this file.</div>
    </div>
    <div class="dispo-wrap">
      <div class="ttl">VERDICT</div>
      <div class="dispo">
        <button class="yes ${state.dispo==='YES'?'sel':''}" onclick="setDispo('YES')">&#9873; NEGATIVE NEWS</button>
        <button class="no ${state.dispo==='NO'?'sel':''}" onclick="setDispo('NO')">&#10003; NO NEGATIVE NEWS</button>
      </div>
      ${gate}
      <button class="signoff" onclick="submitCase()" ${ready?'':'disabled'}>Sign off &amp; stamp</button>
    </div>`;
}

function renderFeedback(c){
  const r = state.result;
  const lab = a => a==="YES" ? "NEGATIVE NEWS" : "NO NEGATIVE NEWS";
  const chosen = state.dispo ? lab(state.dispo) : "NO DECISION (time up)";
  const sanction = ofacTrueMatch(c);

  let sancLine;
  if(sanction) sancLine = `<span class="bad"><b>Confirmed OFAC match</b> — exact name AND same person (identifiers match). This alone is negative news.</span>`;
  else if(r.res.length) sancLine = `<span class="mid">OFAC returned ${r.res.length} namesake(s), but identifiers (DOB/nationality) do NOT match — different person. No true sanctions match.</span>`;
  else sancLine = `<span class="good">No OFAC results.</span>`;

  let banner = "";
  if(r.strikeAdded) banner = `<div class="strikebar">&#10007; STRIKE — you cleared a subject with reportable negative news. (${strikes}/3)</div>`;
  else if(r.falseAlarm) banner = `<div class="falsebar">False alarm — you flagged a clean subject. No strike, but over-flagging has costs.</div>`;
  else if(r.correct && r.streakBonus) banner = `<div class="streakbar">&#128293; Streak ${streak} — +${r.streakBonus} bonus</div>`;

  let html = `<div class="fb">
    ${banner}
    <h3 class="${r.correct?'good':'bad'}">You said ${chosen} — correct answer: ${lab(r.answer)} ${r.correct?'✓':'✗'}</h3>
    <div>Web calls: <span class="good">${r.right} right</span>, <span class="bad">${r.wrong} wrong</span>, <span class="mid">${r.untagged} skipped</span> &nbsp;|&nbsp; OFAC: <span class="good">${r.oright} right</span>, <span class="bad">${r.owrong} wrong</span></div>
    <div>Case points: <b>${r.caseScore>=0?'+':''}${r.caseScore}</b> (verdict ${r.dpts}, web ${r.tagPts>=0?'+':''}${r.tagPts}, OFAC ${r.ofacPts>=0?'+':''}${r.ofacPts}${r.streakBonus?`, streak +${r.streakBonus}`:''})</div>
    <div class="truth"><b>OFAC sanctions check:</b> ${sancLine}</div>
    <div class="truth"><b>Truth:</b> ${c.truth}</div>
    <div class="teach">${c.teach}</div>
    <div style="font-size:12px;font-weight:bold;margin-top:8px;">Answer key — web results</div>`;
  c.hits.forEach((hit,i)=>{
    const want = hit.relevant ? "NEGATIVE NEWS" : "not relevant";
    const got = state.revealed[i] ? (state.tags[i]? (state.tags[i]==='relevant'?'negative news':'not relevant') : 'skipped') : 'never loaded';
    const ok = state.revealed[i] && state.tags[i]!==null && ((state.tags[i]==='relevant')===hit.relevant);
    html += `<div class="keyrow ${ok?'good':(state.revealed[i]?'bad':'mid')}">
      ${hit.relevant?'⚑':'·'} ${hit.h.slice(0,44)}${hit.h.length>44?'…':''} → <b>${want}</b> (you: ${got})</div>`;
  });
  if(r.res.length){
    html += `<div style="font-size:12px;font-weight:bold;margin-top:8px;">Answer key — OFAC</div>`;
    r.res.forEach((rr,i)=>{
      const want = rr.isMatch ? "SAME PERSON (match)" : "different person (no match)";
      const got = state.ofacTags[i] ? (state.ofacTags[i]==='match'?'match':'no match') : 'skipped';
      const ok = state.ofacTags[i]!==null && ((state.ofacTags[i]==='match')===rr.isMatch);
      html += `<div class="keyrow ${ok?'good':'bad'}">${rr.isMatch?'⚑':'·'} ${rr.name} → <b>${want}</b> (you: ${got})</div>`;
    });
  }
  let nLabel, nFn;
  if(strikes>=3){ nLabel="View termination"; nFn="terminated()"; }
  else if(idx===DECK.length-1){ nLabel="See final score"; nFn="finish()"; }
  else { nLabel="Next case →"; nFn="nextCase()"; }
  html += `<button class="nextbtn" onclick="${nFn}">${nLabel}</button></div>`;
  return html;
}

function setTab(t){ state.tab=t; if(t==='ofac') state.ofacVisited=true; render(); }
function setTag(i,key){ if(state.submitted)return; state.tags[i]=state.tags[i]===key?null:key; render(); }
function setOfac(i,key){ if(state.submitted)return; state.ofacTags[i]=state.ofacTags[i]===key?null:key; render(); }
function setDispo(d){ if(state.submitted)return; state.dispo=d; render(); }
function reveal(i){ if(state.submitted)return; state.revealed[i]=true; score-=1; render(); }
function submitCase(){ if(!state.dispo||!state.ofacVisited)return; doSubmit(); }

function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }
function startTimer(){ stopTimer(); timer=setInterval(()=>{
  if(!state||state.submitted){return;}
  state.timeLeft--;
  const el=document.getElementById('clock');
  if(el){ el.textContent=fmt(state.timeLeft); if(state.timeLeft<=10) el.classList.add('low'); }
  if(state.timeLeft<=0){ stopTimer(); doSubmit(); }
},1000); }

function doSubmit(){
  if(state.submitted) return;
  stopTimer();
  const c = DECK[idx];
  const answer = caseAnswer(c);
  const correct = state.dispo === answer;
  let tagPts=0,right=0,wrong=0,untagged=0;
  c.hits.forEach((hit,i)=>{ if(!state.revealed[i])return; const want=hit.relevant?'relevant':'irrelevant';
    if(state.tags[i]===null){untagged++;return;} if(state.tags[i]===want){tagPts++;right++;}else{tagPts--;wrong++;} });
  const res=ofacFor(c); let ofacPts=0,oright=0,owrong=0;
  res.forEach((rr,i)=>{ const want=rr.isMatch?'match':'nomatch'; if(state.ofacTags[i]===null)return;
    if(state.ofacTags[i]===want){ofacPts++;oright++;}else{ofacPts--;owrong++;} });
  const dpts = correct?10:0;
  let streakBonus=0;
  if(correct){ streak++; if(streak>=3) streakBonus=2; } else { streak=0; }
  if(streak>best) best=streak;
  let strikeAdded=false, falseAlarm=false;
  if(!correct){ if(answer==='YES'){ strikes++; strikeAdded=true; } else { falseAlarm=true; } }
  const caseScore = dpts+tagPts+ofacPts+streakBonus;
  score += caseScore;
  state.result = {answer,correct,dpts,tagPts,right,wrong,untagged,ofacPts,oright,owrong,res,caseScore,streakBonus,strikeAdded,falseAlarm};
  state.submitted = true;
  thunk(); showStamp(state.dispo);
  render();
}

function showStamp(dispo){
  const el=document.createElement('div');
  el.className='stamp';
  el.textContent = dispo==='YES' ? 'NEGATIVE NEWS' : (dispo==='NO' ? 'CLEARED' : 'NO DECISION');
  const col = dispo==='YES' ? '#a50e0e' : (dispo==='NO' ? '#137333' : '#5f6368');
  el.style.color=col; el.style.borderColor=col;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}
function thunk(){ try{
  const a=new (window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.setValueAtTime(150,a.currentTime); o.frequency.exponentialRampToValueAtTime(55,a.currentTime+0.12);
  g.gain.setValueAtTime(0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.2);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.22);
}catch(e){} }

function nextCase(){ idx++; startCase(); }
function finish(){
  stopTimer();
  const max = DECK.length*10;
  app.innerHTML = `
    <div class="topbar">${gLogo()}</div>
    <div class="layout"><div class="fb center" style="max-width:560px;margin:40px auto;">
      <h3>Shift complete — ${DECK.length} cases${strikes===0?', clean record':''}</h3>
      <p style="font-size:30px;" class="${score>=max*0.7?'good':(score>=max*0.4?'mid':'bad')}">Final score: ${score}</p>
      <p style="color:#5f6368;">Strikes: ${strikes}/3 &middot; Best streak: ${best}</p>
      <p style="color:#5f6368;">Genuine negative news on the actual person is rarer than it looks. Most hits are noise, wrong-person, or guilt-by-association.</p>
      <button class="nextbtn" onclick="restart()">Play again</button>
    </div></div>`;
}
function terminated(){
  stopTimer();
  app.innerHTML = `
    <div class="topbar">${gLogo()}</div>
    <div class="layout"><div class="fb center" style="max-width:560px;margin:40px auto;">
      <h3 class="bad">TERMINATED</h3>
      <p>Three regulatory strikes. You cleared subjects who had reportable negative news, and compliance has let you go.</p>
      <p style="font-size:26px;">Final score: ${score} &middot; Best streak: ${best}</p>
      <p style="color:#5f6368;">Calibration beats speed. Verify identity before you clear anyone.</p>
      <button class="nextbtn" onclick="restart()">Try again</button>
    </div></div>`;
}
function intro(){
  app.innerHTML = `
    <div class="browserbar">
      <div class="btab active">&#128269; Goggle</div>
      <div class="btab ofac">&#128737; OFAC Sanctions Search</div>
    </div>
    <div class="layout"><div class="intro">
      <h1>Due Diligence Analyst &mdash; Shift Briefing</h1>
      <p class="lead">A subject's name lands on your desk. Decide whether they have genuine <b>negative news</b>. You have two independent checks &mdash; and you must run both before you sign off.</p>
      <div class="checkrow">
        <div class="checkcard">
          <h3>&#9312; &#128269; Adverse-media search</h3>
          <ul>
            <li>Search the web and tag each result.</li>
            <li>A result is negative news only if it is the <b>same person</b> (match name + age/location)</li>
            <li>&hellip;and a <b>serious risk</b>: crime, fraud, sanctions.</li>
            <li>Noise to dismiss: wrong-person namesakes, trivial items, resolved-with-no-finding, and news about an associate or company.</li>
          </ul>
        </div>
        <div class="checkcard ofaccard">
          <h3>&#9313; &#128737; OFAC sanctions search</h3>
          <ul>
            <li>Run the name through the sanctions list &mdash; a <b>separate tab you must open</b> before signing off.</li>
            <li>A name hit is <b>not</b> enough on its own.</li>
            <li>It counts only if the name is an <b>exact match</b> AND it's the <b>same person</b> &mdash; verify <b>DOB / nationality</b> against the customer file.</li>
          </ul>
        </div>
      </div>
      <div class="rulebox"><b>The matching rule:</b> either check can independently produce negative news. A clean web search does <b>not</b> clear a sanctions hit, and a sanctions namesake with a different DOB is <b>not</b> your subject. Verify identity, every time.</div>
      <p class="scorenote">Scoring: <b>+10</b> correct verdict &middot; <b>&plusmn;1</b> per web-result call &middot; <b>&plusmn;1</b> per OFAC call &middot; <b>&minus;1</b> to load a deep (later-page) result. ${CASES.length} cases, <b>shuffled every round</b>.</p>
      <button class="startbtn" onclick="begin()">Start shift &rsaquo;</button>
    </div></div>`;
}
function begin(){ DECK=shuffle(CASES); idx=0; score=0; strikes=0; streak=0; best=0; startCase(); }
function restart(){ DECK=shuffle(CASES); idx=0; score=0; strikes=0; streak=0; best=0; startCase(); }

intro();
</script>
</body>
</html>
